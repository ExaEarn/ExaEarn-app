            "ExaPayIntentRequest": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                    "amount",
                    "currency",
                    "idempotency_key"
                ],
                "properties": {
                    "payer_user_id": {
                        "type": "integer",
                        "minimum": 1
                    },
                    "amount": {
                        "type": "string",
                        "pattern": "^-?[0-9]+(?:\\.[0-9]+)?$",
                        "example": "100.00000000"
                    },
                    "currency": {
                        "type": "string",
                        "maxLength": 8
                    },
                    "description": {
                        "type": "string",
                        "maxLength": 200
                    },
                    "merchant_reference": {
                        "type": "string",
                        "maxLength": 160
                    },
                    "customer_reference": {
                        "type": "string",
                        "maxLength": 160
                    },
                    "environment": {
                        "type": "string",
                        "enum": [
                            "SANDBOX",
                            "PRODUCTION",
                            "sandbox",
                            "production"
                        ]
                    },
                    "capture_mode": {
                        "type": "string",
                        "enum": [
                            "AUTOMATIC",
                            "MANUAL",
                            "automatic",
                            "manual"
                        ]
                    },
                    "payment_method": {
                        "type": "string",
                        "maxLength": 40
                    },
                    "idempotency_key": {
                        "type": "string",
                        "maxLength": 160
                    },
                    "expires_at": {
                        "type": "string",
                        "format": "date-time"
                    },
                    "metadata": {
                        "type": "object",
                        "additionalProperties": true
                    }
                },
                "example": {
                    "amount": "25.00000000",
                    "currency": "USDT",
                    "environment": "sandbox",
                    "capture_mode": "AUTOMATIC",
                    "idempotency_key": "sandbox-pay-001"
                }
            },
            "ExaPayLinkRequest": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                    "title"
                ],
                "properties": {
                    "title": {
                        "type": "string",
                        "maxLength": 160
                    },
                    "description": {
                        "type": "string",
                        "maxLength": 500
                    },
                    "amount_mode": {
                        "type": "string",
                        "enum": [
                            "FIXED",
                            "VARIABLE",
                            "fixed",
                            "variable"
                        ]
                    },
                    "amount": {
                        "type": "string",
                        "pattern": "^-?[0-9]+(?:\\.[0-9]+)?$",
                        "example": "100.00000000"
                    },
                    "currency": {
                        "type": "string",
                        "maxLength": 8
                    },
                    "maximum_uses": {
                        "type": "integer",
                        "minimum": 1
                    },
                    "success_url": {
                        "type": "string",
                        "format": "uri",
                        "maxLength": 255
                    },
                    "cancel_url": {
                        "type": "string",
                        "format": "uri",
                        "maxLength": 255
                    },
                    "expires_at": {
                        "type": "string",
                        "format": "date-time"
                    },
                    "customer_fields": {
                        "type": "array",
                        "items": {
                            "type": "string"
                        }
                    }
                },
                "example": {
                    "title": "Sandbox invoice",
                    "amount_mode": "FIXED",
                    "amount": "25.00000000",
                    "currency": "USDT"
                }
            },
            "ExaPayRefundRequest": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                    "payment_reference",
                    "currency",
                    "reason"
                ],
                "properties": {
                    "payment_reference": {
                        "type": "string",
                        "maxLength": 160
                    },
                    "currency": {
                        "type": "string",
                        "maxLength": 8
                    },
                    "reason": {
                        "type": "string",
                        "maxLength": 160
                    }
                },
                "example": {
                    "payment_reference": "PAY-SANDBOX-001",
                    "currency": "USDT",
                    "reason": "Sandbox customer request"
                }
            }
        },
        "responses": {
            "ValidationError": {
                "description": "Malformed or invalid request.",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/DeveloperError"
                        }
                    }
                }
            },
            "AuthError": {
                "description": "Authentication failed.",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/DeveloperError"
                        }
                    }
                }
            },
            "PermissionError": {
                "description": "Scope, IP, environment, or approval denied.",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/DeveloperError"
                        }
                    }
                }
            },
            "NotFoundError": {
                "description": "Resource not found.",
                "content": {
