    "components": {
        "securitySchemes": {
            "ExaSignedRequest": {
                "type": "apiKey",
                "in": "header",
                "name": "EXA-API-KEY",
                "description": "Also requires EXA-API-TIMESTAMP, EXA-API-NONCE, and EXA-API-SIGNATURE."
            },
            "DeveloperSession": {
                "type": "apiKey",
                "in": "cookie",
                "name": "exaearn_session",
                "description": "Authenticated canonical ExaEarn Developer session. Sensitive writes also require recent authentication."
            }
        },
        "schemas": {
            "ProductionAccessRequest": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                    "use_case",
                    "capabilities",
                    "idempotency_key"
                ],
                "properties": {
                    "use_case": {
                        "type": "string",
                        "enum": [
                            "trading_application",
                            "trading_bot",
                            "portfolio_application",
                            "market_data_service",
                            "payment_integration",
                            "wallet_integration",
                            "institutional_integration",
                            "fintech_application",
                            "internal_company_integration",
                            "other"
                        ]
                    },
                    "capabilities": {
                        "type": "array",
                        "minItems": 1,
                        "items": {
                            "type": "string"
                        }
                    },
                    "idempotency_key": {
                        "type": "string",
                        "maxLength": 100
                    },
                    "expected_request_volume": {
                        "type": [
                            "string",
                            "null"
                        ]
                    },
                    "expected_trading_volume": {
                        "type": [
                            "string",
                            "null"
                        ]
                    },
                    "website": {
                        "type": [
                            "string",
                            "null"
                        ],
                        "format": "uri"
                    },
                    "technical_contact": {
                        "type": [
                            "string",
                            "null"
                        ],
                        "format": "email"
                    },
                    "business_context": {
                        "type": [
                            "string",
                            "null"
                        ],
                        "maxLength": 2000
                    }
                },
                "example": {
                    "use_case": "trading_application",
