name: Developer Platform Production Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: developer-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/developer-platform-gates.yml

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exaearn_ci
          POSTGRES_USER: exaearn_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U exaearn_ci -d exaearn_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: exaearn_ci
      DB_USERNAME: exaearn_ci
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    defaults: { run: { working-directory: backend/api-gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring,pgsql,pdo_pgsql,sqlite3,pdo_sqlite,bcmath,gd', coverage: none }
      - run: composer validate --strict
      - name: Prepare Laravel bootstrap cache
        run: mkdir -p bootstrap/cache && chmod u+rwx bootstrap/cache
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php ../../scripts/lint-php.php app config database routes tests
      - run: php ../../scripts/validate-production-config.php --ci
      - run: php ../../scripts/tests/production-config-validator-fixtures.php
      - run: php ../../scripts/classify-migrations.php --fail-on-unclassified --json=../../artifacts/migration-safety.json
      - run: cp .env.example .env
      - run: php artisan config:cache && php artisan route:cache && php artisan migrate:fresh --force && php artisan migrate:status
      - name: Clear PostgreSQL config before SQLite regression
        run: php artisan config:clear
      - run: php artisan test tests/Feature/DeveloperFinalP1RemediationTest.php tests/Feature/DeveloperApiCredentialSecurityTest.php tests/Feature/DeveloperAuthSecurityTest.php tests/Feature/DeveloperExternalInterfacesWave1Test.php tests/Feature/DeveloperGovernanceWave2Test.php tests/Feature/DeveloperPlatformP0SecurityTest.php tests/Feature/DeveloperProductionAccessTest.php tests/Feature/DeveloperWorkspaceRbacTest.php tests/Feature/Phase14DeveloperPlatformTest.php
        env: { DB_CONNECTION: sqlite, DB_DATABASE: ':memory:', CACHE_STORE: array, QUEUE_CONNECTION: sync }
      - run: php artisan test
        env: { DB_CONNECTION: sqlite, DB_DATABASE: ':memory:', CACHE_STORE: array, QUEUE_CONNECTION: sync }
      - uses: actions/upload-artifact@v4
        with: { name: migration-safety-report, path: artifacts/migration-safety.json, retention-days: 30 }

  contracts-and-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'sqlite3,pdo_sqlite,bcmath' }
      - run: pnpm install --frozen-lockfile
      - name: Validate and generate root Prisma client
        env: { DATABASE_URL: 'postgresql://exaearn_ci:ci-only-password@127.0.0.1:5432/exaearn_ci' }
        run: pnpm exec prisma validate --schema backend/database/prisma/schema.prisma && pnpm exec prisma generate --schema backend/database/prisma/schema.prisma
      - name: Validate and generate blockchain Prisma client
        working-directory: backend/services/blockchain-service
        env: { DATABASE_URL: 'postgresql://exaearn_ci:ci-only-password@127.0.0.1:5432/exaearn_ci' }
        run: pnpm exec prisma validate --schema prisma/schema.prisma && pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Prepare Laravel bootstrap cache
        run: mkdir -p backend/api-gateway/bootstrap/cache && chmod u+rwx backend/api-gateway/bootstrap/cache
      - run: composer install --working-dir=backend/api-gateway --no-interaction --no-progress --prefer-dist
      - run: php scripts/generate-developer-openapi.php
      - run: git diff --exit-code -- openapi/exaearn-developer-v1.yaml apps/developers/src/openapiRequestSchemas.generated.ts
      - run: pnpm --package=@redocly/cli@1.34.0 dlx redocly lint openapi/exaearn-developer-v1.yaml --format=stylish
      - run: pnpm --filter @exaearn/sdk typecheck
      - run: python -m unittest discover packages/python-sdk/tests
      - run: pnpm --filter @exaearn/developers typecheck && pnpm --filter @exaearn/developers build
      - run: pnpm --filter @exaearn/admin typecheck && pnpm --filter @exaearn/admin lint && pnpm --filter @exaearn/admin build

  node-realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter exaearn-blockchain-service lint
      - run: pnpm --filter exaearn-blockchain-service contracts:compile
      - run: pnpm --filter exaearn-blockchain-service test
      - run: pnpm --filter exaearn-blockchain-service contracts:test
      - run: pnpm --filter exaearn-blockchain-service test:developer-ws-load
      - name: Validate Metro configuration
        working-directory: apps/mobile
        run: node -e "const config=require('./metro.config.js'); if (!config || !config.resolver) process.exit(1)"

  security-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan repository history with Gitleaks OSS
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --verbose /github/workspace
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: github/codeql-action/init@v3
        with: { languages: 'javascript-typescript' }
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - run: python -m pip install --disable-pip-version-check -e packages/python-sdk
      - run: node scripts/tests/sbom-validator-fixtures.mjs
      - uses: anchore/sbom-action@v0
        with:
          path: backend/api-gateway
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: realtime-sbom.cdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: developer-portal-sbom.cdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: admin-sbom.cdx.json
          upload-artifact: false
      - name: Validate and bind SBOMs to candidate
        run: >-
          node scripts/validate-sboms.mjs
          backend-sbom.cdx.json
          realtime-sbom.cdx.json
          developer-portal-sbom.cdx.json
          admin-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: exaearn-sboms-${{ github.sha }}
          path: |
            backend-sbom.cdx.json
            realtime-sbom.cdx.json
            developer-portal-sbom.cdx.json
            admin-sbom.cdx.json
            sbom-manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: github/codeql-action/analyze@v3
      - name: Audit Node dependencies
        run: pnpm audit --audit-level high
      - name: Audit Composer dependencies
        if: ${{ always() }}
        run: composer audit --working-dir=backend/api-gateway --locked --abandoned=fail
      - name: Audit Python SDK environment
        if: ${{ always() }}
        run: python -m pip_audit --local

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend/api-gateway
          load: true
          tags: exaearn/api-gateway:${{ github.sha }}
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: { image-ref: 'exaearn/api-gateway:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: false }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/blockchain-service/Dockerfile
          load: true
          tags: exaearn/realtime:${{ github.sha }}
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: { image-ref: 'exaearn/realtime:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: false }
