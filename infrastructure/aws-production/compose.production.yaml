services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to a pinned, scanned image digest}
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to a pinned, scanned image digest}
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 512mb --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable ECR image tag or digest}
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    expose: ["8080"]
    networks: [private, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true

  edge:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE to a pinned, scanned image digest}
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - /srv/exaearn/tls:/run/secrets:ro
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  queue-worker:
    image: ${API_IMAGE:?set API_IMAGE to an immutable ECR image tag or digest}
    profiles: ["approved-financial-workers"]
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90", "--max-time=3600"]
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 120s

  scheduler:
    image: ${API_IMAGE:?set API_IMAGE to an immutable ECR image tag or digest}
    profiles: ["approved-financial-workers"]
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  blockchain-service:
    image: ${BLOCKCHAIN_IMAGE:?set BLOCKCHAIN_IMAGE to an immutable ECR image tag or digest}
    profiles: ["blocked-until-financial-security-approval"]
    restart: unless-stopped
    env_file:
      - /srv/exaearn/.env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}@redis:6379
      BLOCKCHAIN_EVENT_LISTENER_ENABLED: "false"
      WITHDRAWAL_SIGNING_KEY: ""
    command: ["node", "src/index.js"]
    expose: ["4000"]
    networks: [private, edge]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true

networks:
  private:
    internal: true
  edge: {}

volumes:
  postgres-data: {}
  redis-data: {}
