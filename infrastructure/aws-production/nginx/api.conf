server {
    listen 443 ssl;
    server_name api.exaearn.com;

    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    if ($host != api.exaearn.com) {
        return 444;
    }

    include /etc/nginx/conf.d/cloudflare-realip.conf;

    ssl_certificate /run/secrets/origin.crt;
    ssl_certificate_key /run/secrets/origin.key;
    ssl_client_certificate /run/secrets/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 10m;
    server_tokens off;

    root /app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_HOST api.exaearn.com;
        fastcgi_param HTTP_X_FORWARDED_HOST api.exaearn.com;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 65s;
        fastcgi_send_timeout 65s;
    }
}

server {
    listen 8081;
    server_name localhost;
    access_log off;

    location = /healthz {
        return 204;
    }
}
