server {
    listen 443 ssl;
    server_name api.exaearn.com;

    if ($host != api.exaearn.com) {
        return 444;
    }

    include /etc/nginx/conf.d/cloudflare-realip.conf;

    ssl_certificate /run/secrets/origin.crt;
    ssl_certificate_key /run/secrets/origin.key;
    ssl_client_certificate /run/secrets/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 10m;
    server_tokens off;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host api.exaearn.com;
        proxy_set_header X-Forwarded-Host api.exaearn.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
